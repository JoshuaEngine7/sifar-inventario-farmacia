{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block contenido %}
<div class="tarjeta" style="max-width:460px;margin:6vh auto">
  <h2 style="margin-top:0;color:var(--titulo)">Cambiar contraseña</h2>
  {% if obligatorio %}
  <div class="ok">Por seguridad, debes establecer una contraseña nueva antes de usar el sistema.</div>
  {% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/cambiar-password">
    <label>Contraseña actual</label>
    <input type="password" name="actual" required style="width:100%">
    <label>Contraseña nueva (mínimo 8 caracteres)</label>
    <input type="password" name="nueva" required minlength="8" style="width:100%">
    <label>Confirmar contraseña nueva</label>
    <input type="password" name="confirmacion" required style="width:100%">
    <button style="margin-top:1rem;width:100%">Guardar</button>
  </form>
</div>
{% endblock %}
