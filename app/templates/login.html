{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="tarjeta" style="max-width:420px;margin:8vh auto">
  <h2 style="margin-top:0;color:var(--titulo)">{{ APP_NOMBRE }} — Inventario de Farmacia</h2>
  <p style="color:var(--texto-suave);margin-top:-0.5rem">{{ UNIDAD }}</p>
  {% if aviso %}<div class="ok">{{ aviso }}</div>{% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label for="nombre">Usuario</label>
    <select name="nombre" id="nombre" required style="width:100%">
      {% for u in usuarios %}<option value="{{ u.nombre }}">{{ u.nombre }}</option>{% endfor %}
    </select>
    <label for="password">Contraseña</label>
    <input type="password" name="password" id="password" required style="width:100%">
    <button style="margin-top:1rem;width:100%">Entrar</button>
  </form>
</div>
{% endblock %}
